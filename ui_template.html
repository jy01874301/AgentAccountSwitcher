<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #0f1626;
    --card: #1a2338;
    --card-2: #222d47;
    --border: #2c3a5c;
    --text: #e6edf7;
    --dim: #8b9ab8;
    --accent: #4f8cff;
    --accent-2: #2f6fef;
    --green: #3ddc97;
    --amber: #ffc24d;
    --red: #ff5c5c;
    --radius: 14px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  header { display:flex; align-items:center; gap:16px; margin-bottom:24px; }
  .logo {
    width:46px; height:46px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    font-size:22px; box-shadow: 0 8px 20px rgba(79,140,255,.35);
  }
  h1 { font-size:22px; font-weight:700; }
  .sub { color:var(--dim); font-size:13px; margin-top:3px; }
  .status-line { margin-left:auto; text-align:right; }
  .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--dim); margin-right:6px; }
  .status-dot.on { background:var(--green); box-shadow:0 0 8px var(--green); }
  .status-dot.off { background:var(--red); }
  .status-text { font-size:13px; color:var(--dim); }

  .current-card {
    background:linear-gradient(135deg, var(--card-2), var(--card));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:24px;
    display:flex; align-items:center; gap:16px;
  }
  .current-label { color:var(--dim); font-size:12px; letter-spacing:.5px; text-transform:uppercase; }
  .current-name { font-size:20px; font-weight:700; margin-top:4px; display:flex; align-items:center; gap:10px; }
  .badge { font-size:11px; font-weight:500; padding:3px 8px; border-radius:20px; background:rgba(61,220,151,.15); color:var(--green); }
  .current-exp { color:var(--dim); font-size:12px; margin-top:4px; }
  .current-exp.warn { color:var(--amber); }

  .section-title { display:flex; align-items:center; gap:8px; margin:28px 0 14px; }
  .section-title .bar { width:4px; height:18px; background:var(--accent); border-radius:2px; }
  .section-title h2 { font-size:16px; font-weight:600; }
  .section-title .hint { margin-left:auto; color:var(--dim); font-size:13px; }

  /* 最小 300px（原 270）：920px 内容宽下排成 2 列而非 3 列，卡片内容宽约 421px，
     积分明细那一行（时间 + 已使用量，约 340px）才放得下、不会被挤到折行 */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .acct {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    position:relative;
    display:flex; flex-direction:column; gap:10px;
  }
  .acct:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,.3); }
  .acct.active { border-color:var(--green); }
  .acct .top { display:flex; align-items:center; gap:12px; }
  .avatar {
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg,#4f8cff,#3ddc97);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:16px; color:#fff;
  }
  .acct .name { font-size:16px; font-weight:600; }
  .acct .meta { color:var(--dim); font-size:12px; }
  .acct .exp { font-size:12.5px; color:var(--dim); }
  .acct .exp b { color:var(--text); font-weight:600; }
  .acct .exp.warn b { color:var(--amber); }
  .acct .reason { font-size:12px; color:var(--amber); line-height:1.5; }
  .tag-active { font-size:11px; padding:2px 8px; border-radius:12px; background:rgba(61,220,151,.15); color:var(--green); font-weight:600; }
  .tag-unsafe { font-size:11px; padding:2px 8px; border-radius:12px; background:rgba(255,194,77,.15); color:var(--amber); font-weight:600; }
  .tag-ttl { font-size:11px; padding:2px 8px; border-radius:12px; background:rgba(139,154,184,.15); color:var(--dim); font-weight:600; }
  .tag-ttl.short { background:rgba(255,194,77,.15); color:var(--amber); }
  .btn {
    margin-top:auto;
    border:none; border-radius:9px; padding:10px 14px;
    font-size:14px; font-weight:600; cursor:pointer;
    background:var(--accent-2); color:#fff;
    transition: background .12s, opacity .12s;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn:hover { background:var(--accent); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.active { background:var(--green); }
  .btn.active:hover { background:#2fc88a; }

  .toast-wrap { position:fixed; top:22px; left:50%; transform:translateX(-50%); z-index:99; display:flex; flex-direction:column; gap:10px; align-items:center; }
  .toast {
    padding:12px 20px; border-radius:10px; font-size:14px; font-weight:500;
    background:var(--card-2); border:1px solid var(--border); color:var(--text);
    box-shadow:0 10px 30px rgba(0,0,0,.35); animation: slide .25s ease;
    max-width:560px;
  }
  .toast.ok { border-color:var(--green); }
  .toast.ok::before { content:"✓ "; color:var(--green); font-weight:700; }
  .toast.err { border-color:var(--red); }
  .toast.err::before { content:"✕ "; color:var(--red); font-weight:700; }
  @keyframes slide { from{opacity:0; transform:translateY(-12px);} to{opacity:1; transform:translateY(0);} }

  .empty { background:var(--card); border:1px dashed var(--border); border-radius:var(--radius); padding:40px; text-align:center; color:var(--dim); }
  .empty code { background:var(--card-2); padding:2px 7px; border-radius:6px; font-size:13px; }

  .add-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:18px; overflow:hidden; }
  .add-head { display:flex; align-items:center; gap:10px; padding:14px 18px; cursor:pointer; user-select:none; }
  .add-head:hover { background:var(--card-2); }
  .add-title { font-size:15px; font-weight:600; color:var(--accent); }
  .add-body { padding:14px 18px 18px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px; }
  .add-label { font-size:12.5px; color:var(--dim); margin-top:4px; }
  .inp { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:10px 12px; color:var(--text); font-size:14px; outline:none; }
  .inp:focus, .txt:focus { border-color:var(--accent); }
  .txt { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:10px 12px; color:var(--text); font-size:12.5px; outline:none; font-family:Consolas,monospace; resize:vertical; }
  .add-actions { display:flex; gap:10px; margin-top:10px; }
  .file-row { display:flex; align-items:center; gap:10px; }
  .file-inp { display:none; }
  .file-btn { display:inline-flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:10px 14px; color:var(--text); font-size:14px; cursor:pointer; font-weight:500; }
  .file-btn:hover { border-color:var(--accent); }
  .file-name { color:var(--dim); font-size:13px; word-break:break-all; }
  .btn.ghost { background:transparent; border:1px solid var(--border); color:var(--dim); }
  .btn.ghost:hover { background:var(--card-2); color:var(--text); }
  .btn-row { display:flex; gap:8px; margin-top:auto; }
  .btn-row .btn { flex:1; }
  .btn-row .del-btn { flex:0 0 64px; }
  .del-btn:hover { border-color:var(--red); color:var(--red); background:rgba(255,92,92,.08); }

  .modal { position:fixed; inset:0; background:rgba(5,10,20,.6); z-index:200; display:flex; align-items:center; justify-content:center; }
  .modal-box { background:var(--card-2); border:1px solid var(--border); border-radius:var(--radius); padding:24px; width:min(440px,92vw); box-shadow:0 20px 50px rgba(0,0,0,.5); }
  .modal-title { font-size:17px; font-weight:700; margin-bottom:10px; }
  .modal-body { color:var(--dim); font-size:14px; line-height:1.7; }
  .modal-body b { color:var(--text); }

  .tip { background:rgba(79,140,255,.08); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:10px; padding:12px 16px; font-size:12.5px; color:var(--dim); line-height:1.7; margin-bottom:16px; }
  .tip b { color:var(--accent); }
  .tip code { background:var(--card-2); padding:1px 6px; border-radius:5px; font-size:12px; }

  .mini-btn { background:transparent; border:1px solid var(--border); color:var(--dim); border-radius:9px; padding:6px 11px; font-size:12.5px; cursor:pointer; flex-shrink:0; }
  .mini-btn:hover { border-color:var(--accent); color:var(--text); }
  .mini-btn:disabled { opacity:.5; cursor:not-allowed; }

  .credits { border-top:1px solid var(--border); padding-top:10px; display:flex; flex-direction:column; gap:9px; }
  .credits-total { font-size:12.5px; color:var(--dim); }
  .credits-total b { color:var(--text); font-size:16px; font-weight:700; }
  .credits-title { font-size:12px; color:var(--dim); letter-spacing:.3px; }
  .credits-msg { font-size:12px; color:var(--dim); line-height:1.5; }
  .credits-msg.err { color:var(--amber); }
  .ci { display:flex; flex-direction:column; gap:5px; }
  /* 时间与已使用量同一行、两端对齐。两块都 nowrap：实在放不下时整块换到下一行，
     绝不会出现"一侧折行、另一侧单行"那种基线错位 */
  .ci-info { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .ci-info > span { white-space:nowrap; }
  .ci-name { font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; }
  .ci-used { font-size:12px; color:var(--text); }
  .ci-when { font-size:12px; color:var(--dim); }
  .ci-bar { height:5px; border-radius:3px; background:var(--card-2); overflow:hidden; margin-top:1px; }
  .ci-bar i { display:block; height:100%; border-radius:3px; background:#2bbfa8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">{{LOGO}}</div>
    <div>
      <h1>{{TITLE}}</h1>
      <div class="sub">{{SUBTITLE}}</div>
    </div>
    <div class="status-line">
      <div><span class="status-dot off" id="srvDot"></span><span class="status-text" id="srvText">连接本地服务…</span></div>
    </div>
  </header>

  <div class="tip">{{TIP}}</div>

  <div class="current-card">
    <div class="logo" style="width:38px;height:38px;font-size:18px;">&#128100;</div>
    <div>
      <div class="current-label">当前桌面端账号</div>
      <div class="current-name"><span id="curName">--</span> <span class="badge" id="curBadge" style="display:none">当前</span></div>
      <div class="current-exp" id="curExp"></div>
    </div>
  </div>

  <div class="section-title">
    <div class="bar"></div>
    <h2>可用账号（来自 {{AUTH_DIR}}\）</h2>
    <span class="hint" id="acctCount"></span>
    <button class="mini-btn" id="credBtn" style="margin-left:12px;display:none"
            onclick="loadCredits(true)">&#8635; 刷新积分</button>
  </div>

  <div class="add-card">
    <div class="add-head" onclick="toggleAdd()">
      <span class="add-title">＋ 添加账号</span>
      <span class="hint" id="addState">{{ADD_HINT}}</span>
    </div>
    <div class="add-body" id="addBody" style="display:none;">
      <label class="add-label">{{FILE_LABEL}}</label>
      <div class="file-row">
        <label class="file-btn" for="addFile">&#128194; 选择文件</label>
        <input type="file" id="addFile" class="file-inp" accept="{{ACCEPT}}">
        <span class="file-name" id="addFileName">未选择文件</span>
      </div>
      <label class="add-label">账号昵称 / 标识（自动从文件读取，可修改）</label>
      <input type="text" id="addName" class="inp" placeholder="例如：myaccount" autocomplete="off">
      <div class="add-actions">
        <button class="btn" id="addBtn" onclick="doAddFromFile()">保存账号</button>
        <button class="btn ghost" onclick="toggleAdd(false)">取消</button>
      </div>
    </div>
  </div>

  <div class="grid" id="acctGrid"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div class="modal" id="confirmModal" style="display:none;">
  <div class="modal-box">
    <div class="modal-title">确认删除</div>
    <div class="modal-body">确定要从 {{AUTH_DIR}}\ 删除账号 <b id="delName"></b> 吗？此操作不可撤销。</div>
    <div class="add-actions">
      <button class="btn" onclick="doDelete()">确认删除</button>
      <button class="btn ghost" onclick="closeConfirm()">取消</button>
    </div>
  </div>
</div>

<script>
const UI = { authDir: "{{AUTH_DIR}}", cmd: "{{CMD}}", credits: "{{CREDITS}}" };
const API = { accounts:'/api/accounts', current:'/api/current', switch:'/api/switch', add:'/api/add', remove:'/api/remove', refresh:'/api/refresh', credits:'/api/credits' };

async function req(path){
  const r = await fetch(path);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function post(path, data){
  const r = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Switcher-Token':(window.SWITCHER_TOKEN||'')},body:JSON.stringify(data||{})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function toast(msg,type='ok'){
  const el=document.createElement('div');
  el.className='toast '+(type==='ok'?'ok':'err');
  el.textContent=msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),320); }, 5000);
}
function setSrv(on){
  const dot=document.getElementById('srvDot');
  dot.className='status-dot '+(on?'on':'off');
  document.getElementById('srvText').textContent=on?'本地服务已连接':'本地服务未连接';
}
function fmtDate(s){
  if(!s) return '未知';
  const d=new Date(s);
  return d.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function remainDays(s){
  if(!s) return null;
  return (new Date(s)-Date.now())/86400000;
}
function initials(name){
  if(!name) return '?';
  const c=name.trim();
  return c.length>=2 ? c.slice(-2) : c;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 通道标签：oneid_login 才是长期；enterprise_switch 是短期（续期也不会变长）
function ttlTag(a){
  const src=a.token_source||'';
  if(!src) return '';
  const short = src!=='oneid_login';
  // 后端并不返回 expires_in_days，直接用它会恒为 undefined（短期标签永远显示"通道"），
  // 因此改由 expires_at 现算剩余天数
  const rd=remainDays(a.expires_at);
  const days=(rd!=null&&rd>=0)?Math.round(rd):(a.expires_in_days||0);
  const text = short ? '短期 '+(days?days+'天':'通道') : '长期 60天';
  return `<span class="tag-ttl${short?' short':''}" title="签发通道 token_source=${esc(src)}">${esc(text)}</span>`;
}

function isCurrentActive(a, cur){
  if(!cur || cur.length===0) return false;
  const c=cur[0];
  if(!c || c.ok===false) return false;
  return !!a.ok && !!a.nickname && !!c.nickname && a.nickname===c.nickname;
}

// 积分明细（仅 WorkBuddy 侧有该接口；Trae 侧 UI.credits 为空，整块跳过）
let creditsMap={}, creditsTs='';
function fmtNum(v){
  const n=Number(v);
  if(!isFinite(n)) return '0';
  return n.toLocaleString('zh-CN',{maximumFractionDigits:2});
}
function creditsBlock(file){
  if(UI.credits!=='1') return '';
  const c=creditsMap[file];
  if(!c) return '<div class="credits"><div class="credits-msg">积分读取中…</div></div>';
  if(!c.ok){
    return '<div class="credits"><div class="credits-title">积分明细</div>'
      +'<div class="credits-msg err">'+esc(c.reason||'积分查询失败')+'</div></div>';
  }
  let h='<div class="credits"><div class="credits-total">总剩余积分 <b>'
    +fmtNum(c.total_remain)+'</b></div>';
  const items=c.items||[];
  if(!items.length){
    return h+'<div class="credits-msg">暂无可用积分包</div></div>';
  }
  h+='<div class="credits-title">积分明细</div>';
  items.forEach(function(it){
    const pct=Math.max(0,Math.min(100,Number(it.used_percent)||0));
    // 时间在左、已使用量在右，同一行；两块都 nowrap，极窄卡片下整块换行也不会错位
    h+='<div class="ci">'
      +'<div class="ci-name">'+esc(it.label)+'</div>'
      +'<div class="ci-info">'
      +'<span class="ci-when">'+esc(it.time_label)+' '+esc(it.time||'-')+'</span>'
      +'<span class="ci-used">已使用 '+fmtNum(it.used)+'/'+fmtNum(it.total)
      +' 剩余'+esc(it.remain_percent)+'%</span></div>'
      +'<div class="ci-bar"><i style="width:'+pct+'%"></i></div>'
      +'</div>';
  });
  return h+'</div>';
}
async function loadCredits(force){
  if(UI.credits!=='1') return;
  const btn=document.getElementById('credBtn');
  if(btn){ btn.style.display='inline-flex'; btn.disabled=true; btn.textContent='查询中…'; }
  try{
    const d=await req(API.credits+(force?'?force=1':''));
    const map={};
    (d.accounts||[]).forEach(function(a){ map[a.file]=a; });
    creditsMap=map;
    creditsTs=d.ts||'';
    if(btn) btn.textContent=d.cached?'↻ 刷新积分':'↻ 刷新积分';
  }catch(err){
    if(btn) btn.textContent='积分查询失败，点击重试';
  }finally{
    if(btn) btn.disabled=false;
    if(lastList.length) renderAccounts(lastList, lastCurrent);
  }
}

let lastCurrent=null;
async function load(){
  try{
    setSrv(true);
    const [a,c] = await Promise.all([req(API.accounts), req(API.current)]);
    renderCurrent(c.current);
    renderAccounts(a.accounts, c.current);
  }catch(e){
    setSrv(false);
    document.getElementById('acctGrid').innerHTML =
      '<div class="empty">无法连接本地服务。请先双击 <code>'+esc(UI.cmd)+'</code>，或运行其对应的 --serve 命令。</div>';
    document.getElementById('curName').textContent='未连接';
  }
}
function renderCurrent(cur){
  lastCurrent=cur||null;
  if(!cur || cur.length===0){
    document.getElementById('curName').textContent='未连接';
    document.getElementById('curExp').textContent='无法获取当前账号';
    document.getElementById('curBadge').style.display='none';
    return;
  }
  const c=cur[0];
  if(c.ok===false){
    document.getElementById('curName').textContent=c.nickname||'未登录';
    document.getElementById('curExp').textContent=c.reason||'';
    document.getElementById('curBadge').style.display='none';
    return;
  }
  document.getElementById('curName').textContent=c.nickname || c.file || '未知';
  const rd=remainDays(c.expires_at);
  const el=document.getElementById('curExp');
  if(rd!=null){
    el.className='current-exp'+(rd<3?' warn':'');
    el.textContent='登录态'+(rd>=0?('剩余 '+rd.toFixed(1)+' 天'):'已过期')+' · 有效期至 '+fmtDate(c.expires_at);
  } else el.textContent='登录态有效期未知';
  document.getElementById('curBadge').style.display='inline-block';
}
let lastList=[];
function renderAccounts(list, cur){
  lastList=list||[];
  const grid=document.getElementById('acctGrid');
  document.getElementById('acctCount').textContent=list.length+' 个'
    + (creditsTs?(' · 积分更新于 '+creditsTs):'');
  if(list.length===0){
    grid.innerHTML='<div class="empty">'+UI.authDir+'\\ 目录下没有账号文件。{{EMPTY_HINT}}</div>';
    return;
  }
  grid.innerHTML='';
  list.forEach(a=>{
    const isActive = isCurrentActive(a, cur);
    const card=document.createElement('div');
    card.className='acct'+(isActive?' active':'');
    const rd=remainDays(a.expires_at);
    const expCls = a.ok && rd!=null && rd<3 ? ' warn':'';
    const meta = esc(a.file)+(a.region?' · '+esc(a.region):'')+(a.ok?'':' (不可用)');
    card.innerHTML=`
      <div class="top">
        <div class="avatar">${initials(a.nickname)}</div>
        <div>
          <div class="name">${esc(a.nickname)} ${isActive?'<span class="tag-active">当前</span>':(a.ok?'':'<span class="tag-unsafe">不可用</span>')} ${ttlTag(a)}</div>
          <div class="meta">${meta}</div>
        </div>
      </div>
      ${ a.ok
        ? `<div class="exp${expCls}">登录态 ${rd!=null?(rd>=0?'剩余 <b>'+rd.toFixed(1)+'</b> 天':'<b>已过期</b>'):'有效期未知'} · ${fmtDate(a.expires_at)}</div>`
        : `<div class="reason">${esc(a.reason||'不可用')}</div>`
      }
      ${creditsBlock(a.file)}
      <div class="btn-row">
        <button class="btn ${isActive?'active':''}" data-file="${esc(a.file)}" data-nick="${esc(a.nickname)}" ${isActive?'disabled':''} ${a.ok?'':'disabled'}>
          ${isActive?'当前账号':'切换到该账号'}
        </button>
        <button class="btn ghost del-btn" data-file="${esc(a.file)}" data-nick="${esc(a.nickname)}" title="从 ${esc(UI.authDir)} 删除">删除</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

let pendingDeleteFile=null, pendingDeleteNick='';
function toggleAdd(force){
  const body=document.getElementById('addBody');
  const show = force===undefined ? (body.style.display==='none') : force;
  body.style.display = show?'flex':'none';
  document.getElementById('addState').textContent = show ? '导入后点击保存，内容会写入 '+UI.authDir+'\\' : "{{ADD_HINT}}";
}
function confirmDelete(file, nick){
  pendingDeleteFile=file; pendingDeleteNick=nick;
  document.getElementById('delName').textContent=nick+'（'+file+'）';
  document.getElementById('confirmModal').style.display='flex';
}
function closeConfirm(){
  document.getElementById('confirmModal').style.display='none';
  pendingDeleteFile=null; pendingDeleteNick='';
}
async function doDelete(){
  const file=pendingDeleteFile;
  closeConfirm();
  if(!file) return;
  try{
    const data=await post(API.remove,{file:file});
    toast(data.message, data.ok?'ok':'err');
    if(data.ok) load();
  }catch(err){ toast('请求失败：'+err.message,'err'); }
}
let selectedContent=null;
function refreshAddState(){
  const has=!!selectedContent && !!document.getElementById('addName').value;
  document.getElementById('addBtn').disabled=has?false:true;
}
document.getElementById('addFile').addEventListener('change', (e)=>{
  const f=e.target.files[0];
  if(!f) return;
  document.getElementById('addFileName').textContent=f.name;
  const rd=new FileReader();
  rd.onload=()=>{
    selectedContent=rd.result;
    let nick='';
    try{
      const data=JSON.parse(rd.result);
      nick=(data.account && data.account.nickname) || '';
    }catch(e){}
    document.getElementById('addName').value=nick||'';
    refreshAddState();
  };
  rd.readAsText(f);
});
document.getElementById('addName').addEventListener('input', refreshAddState);

async function doAddFromFile(){
  const name=document.getElementById('addName').value.trim();
  const content=selectedContent;
  const btn=document.getElementById('addBtn');
  if(!name){ toast('请填写账号昵称/标识','err'); return; }
  if(!content){ toast('请先选择账号文件','err'); return; }
  btn.disabled=true; btn.textContent='保存中…';
  try{
    const data=await post(API.add,{name:name,content:content});
    toast(data.message, data.ok?'ok':'err');
    if(data.ok){
      document.getElementById('addFile').value='';
      document.getElementById('addFileName').textContent='未选择文件';
      document.getElementById('addName').value='';
      selectedContent=null;
      refreshAddState();
      toggleAdd(false);
      load();
    }
  }catch(err){ toast('请求失败：'+err.message,'err'); }
  btn.disabled=false; btn.textContent='保存账号';
}

document.getElementById('acctGrid').addEventListener('click', async (e)=>{
  const btn=e.target.closest('.btn');
  if(!btn || btn.disabled) return;
  if(btn.classList.contains('del-btn')){
    confirmDelete(btn.dataset.file, btn.dataset.nick||btn.dataset.file);
    return;
  }
  const file=btn.dataset.file;
  const nick=btn.dataset.nick||'';
  btn.disabled=true; btn.textContent='切换中…';
  try{
    const data=await post(API.switch,{name:file});
    toast(data.message, data.ok?'ok':'err');
    if(data.ok){
      btn.disabled=false; btn.innerHTML='当前账号';
      // 续期只动本地账号库文件，不必等客户端采纳，切完立即发
      try{
        const sd=await post(API.refresh,{file:file});
        toast(sd.message, sd.ok?'ok':'err');
      }catch(e){}
      await settleAfterSwitch(nick);
    }
    else { btn.disabled=false; btn.innerHTML='切换到该账号'; }
  }catch(err){
    toast('请求失败：'+err.message,'err');
    btn.disabled=false; btn.innerHTML='切换到该账号';
  }
});

function currentMatches(nick){
  const c = lastCurrent && lastCurrent[0];
  if(!c) return false;
  return !!nick && c.ok!==false && c.nickname===nick;
}
async function settleAfterSwitch(nick, tries=6, gap=500){
  for(let i=0;i<tries;i++){
    await load();
    if(currentMatches(nick)) return true;
    await new Promise(r=>setTimeout(r,gap));
  }
  return false;
}

load();
loadCredits();
</script>

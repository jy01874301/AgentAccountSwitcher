<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #0f1626;
    --card: #1a2338;
    --card-2: #222d47;
    --border: #2c3a5c;
    --text: #e6edf7;
    --dim: #8b9ab8;
    --accent: #4f8cff;
    --accent-2: #2f6fef;
    --green: #3ddc97;
    --amber: #ffc24d;
    --red: #ff5c5c;
    --red-deep: #c62828;   /* 白字红底的底色：对比度 5.65:1 */
    --radius: 14px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }   /* 行宽贴合内容：960 时
     身份列+积分块+操作列只占约 800px，右侧会空出一大块（用户截图反馈）*/
  header { display:flex; align-items:center; gap:16px; margin-bottom:24px; }
  .logo {
    width:46px; height:46px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    font-size:22px; box-shadow: 0 8px 20px rgba(79,140,255,.35);
  }
  h1 { font-size:22px; font-weight:700; }
  .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--dim); margin-right:6px; }
  .status-dot.on { background:var(--green); box-shadow:0 0 8px var(--green); }
  .status-dot.off { background:var(--red); }
  .status-text { font-size:13px; color:var(--dim); }

  .tip-lead { font-weight:600; color:var(--text); font-size:13px; margin-bottom:5px; }
  .section-title { display:flex; align-items:center; gap:8px; margin:18px 0 9px; flex-wrap:wrap; }
  .section-title .bar { width:4px; height:18px; background:var(--accent); border-radius:2px; }
  .section-title h2 { font-size:16px; font-weight:600; }
  .section-title .hint { color:var(--dim); font-size:13px; }
  .tools { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }

  /* ---- 账号列表：每行一个账号，左身份 / 中积分与签到 / 右操作 ---- */
  .list { display:flex; flex-direction:column; gap:7px; }
  .row {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:10px 13px;
    display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .row:hover { border-color:#3a4a72; box-shadow:0 8px 20px rgba(0,0,0,.22); }
  .row.cur { border-color:var(--green); background:linear-gradient(135deg,var(--card-2),var(--card)); }

  .who { flex:0 0 254px; min-width:0; display:flex; gap:9px; align-items:flex-start; }
  /* 头像全站统一：圆形渐变 + 昵称后两字。当前账号卡片与列表行共用同一个类 */
  .avatar {
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg,#4f8cff,#3ddc97);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:12.5px; color:#fff; letter-spacing:-.5px;
  }
  .who-body { min-width:0; flex:1 1 auto; }
  .name { font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .meta { color:var(--dim); font-size:11.5px; line-height:1.4; margin-top:3px; word-break:break-all; }
  .exp { font-size:12px; color:var(--dim); line-height:1.4; margin-top:4px;
         display:flex; flex-wrap:wrap; gap:0 5px; }
  .exp b { color:var(--text); font-weight:600; }
  .exp.warn b { color:var(--amber); }
  .exp-ttl, .exp-when { white-space:nowrap; }
  .reason { font-size:12px; color:var(--amber); line-height:1.5; margin-top:5px; }

  .ck { font-size:11.5px; color:var(--dim); margin-top:3px; display:flex; align-items:center; gap:5px; }
  .ck .dot { width:7px; height:7px; border-radius:50%; background:var(--dim); flex-shrink:0; }
  .ck.ok { color:var(--green); }
  .ck.ok .dot { background:var(--green); box-shadow:0 0 6px var(--green); }
  .ck.todo { color:var(--amber); }
  .ck.todo .dot { background:var(--amber); }
  .ck.err { color:var(--amber); }
  .ck.err .dot { background:var(--amber); }

  .body { flex:1 1 300px; min-width:220px; }
  .acts { flex:0 0 110px; display:flex; flex-direction:column; gap:6px; }

  .tag-active { font-size:11px; padding:2px 8px; border-radius:12px; background:rgba(61,220,151,.15); color:var(--green); font-weight:600; }
  .tag-unsafe { font-size:11px; padding:2px 8px; border-radius:12px; background:rgba(255,194,77,.15); color:var(--amber); font-weight:600; }
  .tag-ttl { font-size:11px; padding:2px 8px; border-radius:12px; background:rgba(139,154,184,.15); color:var(--dim); font-weight:600; }
  .tag-ttl.short { background:rgba(255,194,77,.15); color:var(--amber); }

  .btn {
    border:none; border-radius:8px; padding:7px 11px;
    font-size:12.5px; font-weight:600; cursor:pointer;
    background:var(--accent-2); color:#fff;
    transition: background .12s, opacity .12s;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn:hover { background:var(--accent); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.active { background:var(--green); }
  .btn.active:hover { background:#2fc88a; }
  .btn.ghost { background:transparent; border:1px solid var(--border); color:var(--dim); }
  .btn.ghost:hover { background:var(--card-2); color:var(--text); }
  /* 白字 + 红底。底色用更深的 --red-deep（#c62828）而不是 --red（#ff5c5c）：
     后者太亮，白字对比度只有 2.99:1，低于 WCAG AA 的 4.5:1；
     #c62828 是 5.65:1，白字清晰可读。*/
  .btn.danger { background:var(--red-deep); border-color:var(--red-deep); color:#fff; }
  .btn.danger:hover { background:#b71c1c; border-color:#b71c1c; color:#fff; }

  .toast-wrap { position:fixed; top:22px; left:50%; transform:translateX(-50%); z-index:99; display:flex; flex-direction:column; gap:10px; align-items:center; }
  .toast {
    padding:12px 20px; border-radius:10px; font-size:14px; font-weight:500;
    background:var(--card-2); border:1px solid var(--border); color:var(--text);
    box-shadow:0 10px 30px rgba(0,0,0,.35); animation: slide .25s ease;
    max-width:620px;
  }
  .toast.ok { border-color:var(--green); }
  .toast.ok::before { content:"✓ "; color:var(--green); font-weight:700; }
  .toast.err { border-color:var(--red); }
  .toast.err::before { content:"✕ "; color:var(--red); font-weight:700; }
  @keyframes slide { from{opacity:0; transform:translateY(-12px);} to{opacity:1; transform:translateY(0);} }

  .empty { background:var(--card); border:1px dashed var(--border); border-radius:var(--radius); padding:40px; text-align:center; color:var(--dim); }
  .empty code { background:var(--card-2); padding:2px 7px; border-radius:6px; font-size:13px; }

  .add-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:16px; overflow:hidden; }
  .add-head { display:flex; align-items:center; gap:10px; padding:14px 18px; cursor:pointer; user-select:none; }
  .add-head:hover { background:var(--card-2); }
  .add-title { font-size:15px; font-weight:600; color:var(--accent); }
  .add-body { padding:14px 18px 18px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px; }
  .add-label { font-size:12.5px; color:var(--dim); margin-top:4px; }
  .inp { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:10px 12px; color:var(--text); font-size:14px; outline:none; }
  .inp:focus, .txt:focus { border-color:var(--accent); }
  .txt { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:10px 12px; color:var(--text); font-size:12.5px; outline:none; font-family:Consolas,monospace; resize:vertical; }
  .add-actions { display:flex; gap:10px; margin-top:10px; }
  .file-row { display:flex; align-items:center; gap:10px; }
  .file-inp { display:none; }
  .file-btn { display:inline-flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:10px 14px; color:var(--text); font-size:14px; cursor:pointer; font-weight:500; }
  .file-btn:hover { border-color:var(--accent); }
  .file-name { color:var(--dim); font-size:13px; word-break:break-all; }

  .modal { position:fixed; inset:0; background:rgba(5,10,20,.6); z-index:200; display:flex; align-items:center; justify-content:center; }
  .modal-box { background:var(--card-2); border:1px solid var(--border); border-radius:var(--radius); padding:24px; width:min(440px,92vw); box-shadow:0 20px 50px rgba(0,0,0,.5); }
  .modal-title { font-size:17px; font-weight:700; margin-bottom:10px; }
  .modal-body { color:var(--dim); font-size:14px; line-height:1.7; }
  .modal-body b { color:var(--text); }

  .tip { background:rgba(79,140,255,.08); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:10px; padding:12px 16px; font-size:12.5px; color:var(--dim); line-height:1.7; margin-bottom:16px; }
  .tip b { color:var(--accent); }
  .tip code { background:var(--card-2); padding:1px 6px; border-radius:5px; font-size:12px; }

  .mini-btn { background:transparent; border:1px solid var(--border); color:var(--dim); border-radius:9px; padding:6px 11px; font-size:12.5px; cursor:pointer; flex-shrink:0; white-space:nowrap; }
  .mini-btn:hover { border-color:var(--accent); color:var(--text); }
  .mini-btn:disabled { opacity:.5; cursor:not-allowed; }

  /* ---- 积分明细 ---- */
  .credits { display:flex; flex-direction:column; gap:6px; }
  .credits-total { font-size:12px; color:var(--dim); display:flex; align-items:baseline; gap:8px; }
  .credits-total b { color:var(--text); font-size:14px; font-weight:700; }
  .credits-title { font-size:11.5px; color:var(--dim); letter-spacing:.3px; }
  .credits-msg { font-size:11.5px; color:var(--dim); line-height:1.45; }
  .credits-msg.err { color:var(--amber); }
    /* .ci 按内容宽度收缩，使「进度条 + 数字」那一排的总宽
     恰好等于上方「档位名 + 时间」那一行 —— 两排左右对齐，
     填充比例才能直接读出来（此前条子 240px、文字行 447px，
     80% 的填充只占整行的 43%，看起来和「剩余20%」对不上）。*/
  /* 必须**填满** .body 那一列：用 fit-content 会让积分块只占 300px、
     而 .body 仍占满剩余宽度，中间空出一大块（用户截图反馈）。*/
  .ci { display:flex; flex-direction:column; gap:4px; width:100%; }
  /* 时间与已使用量同一行、两端对齐。两块都 nowrap：实在放不下时整块换到下一行，
     绝不会出现"一侧折行、另一侧单行"那种基线错位 */
  .ci-info { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .ci-info > span { white-space:nowrap; }
  .ci-name { font-size:12.5px; font-weight:600; color:var(--text); white-space:nowrap; }
  .ci-used { font-size:11.5px; color:var(--text); }
  .ci-when { font-size:11.5px; color:var(--dim); }
    .ci-line { display:flex; align-items:center; gap:10px; min-width:0; }
  .ci-bar { flex:1 1 60px; min-width:60px; height:4px; border-radius:2px;
            background:var(--card-2); overflow:hidden; }
  .ci-bar i { display:block; height:100%; border-radius:3px; background:#2bbfa8; }
  .credits-pending { font-size:12px; color:var(--dim); }

  /* ---- 迁移确认弹框 ---- */
  .modal-box.wide { width:min(560px,94vw); }
  .mig-sub { font-size:12.5px; color:var(--dim); margin-bottom:10px; }
  .mig-list { list-style:none; display:flex; flex-direction:column; gap:6px; margin:0 0 12px; }
  .mig-list li { display:flex; align-items:baseline; gap:10px; font-size:13px; color:var(--text); }
  .mig-list li span.k { flex:0 0 108px; color:var(--dim); font-size:12.5px; }
  .mig-list li span.n { color:var(--amber); font-size:12px; }
  .mig-note { background:var(--bg); border:1px solid var(--border); border-left:3px solid var(--accent);
              border-radius:8px; padding:9px 12px; font-size:12px; color:var(--dim); line-height:1.6; margin-bottom:10px; }
  .mig-warn, .mig-conflict { border-radius:8px; padding:9px 12px; font-size:12px; line-height:1.6; margin-bottom:10px; }
  .mig-info { border-left-color:var(--amber); color:var(--amber); }
  .mig-warn { background:rgba(255,92,92,.08); border:1px solid rgba(255,92,92,.35); color:var(--red); }
  .mig-conflict { background:rgba(255,194,77,.08); border:1px solid rgba(255,194,77,.3); color:var(--amber); }
  .mig-opts { display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; margin-bottom:12px; }
  .mig-chk { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--text); cursor:pointer; }
  .mig-chk input { accent-color:var(--accent); }
  .mig-mode { grid-column:1 / -1; display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--dim); margin-top:2px; }
  .mig-mode label { display:flex; align-items:center; gap:7px; cursor:pointer; }
  .mig-mode input { accent-color:var(--accent); }

  /* ---- 重复页面提示条 ---- */
  .dup-bar { position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:14px;
             justify-content:space-between; padding:10px 18px; margin:0 0 14px;
             background:rgba(255,194,77,.12); border-bottom:1px solid rgba(255,194,77,.4);
             color:var(--amber); font-size:13px; }
  .dup-txt { display:flex; flex-direction:column; gap:2px; }
  .dup-txt span { font-size:12px; color:var(--dim); }

  /* ---- 顶部导航栏：sticky 常驻，锚点 + 全局动作 ---- */
  .nav {
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:8px 14px; margin:0 0 16px;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
  }
  .nav-brand { display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; white-space:nowrap; }
  .nav-brand .logo { width:24px; height:24px; border-radius:7px; font-size:12px; box-shadow:none; }
  .nav-links { display:flex; gap:2px; flex-wrap:wrap; }
  .nav-link {
    font-size:12.5px; color:var(--dim); cursor:pointer; text-decoration:none;
    padding:5px 10px; border-radius:8px; transition:background .12s, color .12s; white-space:nowrap;
  }
  .nav-link:hover { background:var(--card-2); color:var(--text); }
  .nav-link.on { background:rgba(79,140,255,.16); color:var(--accent); }
  .nav-right { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .nav-status { display:flex; align-items:center; font-size:12.5px; color:var(--dim); }
</style>
</head>
<body>
<div class="dup-bar" id="dupBar" style="display:none;">
  <div class="dup-txt">
    <b>这个页面已经开着另一个标签页了</b>
    <span>为保持只有一个页面实例，建议关掉这一个。数据两边是同一份，不会丢。</span>
  </div>
  <button class="btn ghost" onclick="closeThisTab()">关闭此页</button>
</div>
<div class="wrap">
  <nav class="nav">
    <div class="nav-brand"><div class="logo">{{LOGO}}</div><span>{{TITLE}}</span></div>
    <div class="nav-links">
      <a class="nav-link" data-target="secCurrent">当前账号</a>
      <a class="nav-link" data-target="secAccounts">可用账号</a>
      <a class="nav-link" data-target="secAdd">添加账号</a>
    </div>
    <div class="nav-right">
      <span class="nav-status"><span class="status-dot off" id="srvDot"></span><span class="status-text" id="srvText">连接本地服务…</span></span>
      <button class="mini-btn" onclick="load();loadCredits(true);loadCheckin(true)" title="重新读取账号列表与积分/签到">&#8635; 刷新</button>
      <button class="mini-btn" id="openClientBtn" onclick="doOpenClient()" title="启动 WorkBuddy 客户端（切号后需要它重新读取登录态）">&#9654; 打开客户端</button>
    </div>
  </nav>

  <div class="tip"><div class="tip-lead">{{SUBTITLE}}</div>{{TIP}}</div>

  <div class="section-title" id="secCurrent">
    <div class="bar"></div>
    <h2>当前桌面端账号</h2>
    <span class="hint" id="curHint"></span>
  </div>
  <div class="list" id="curList"></div>

  <div class="section-title" id="secAccounts">
    <div class="bar"></div>
    <h2>可用账号（来自 {{AUTH_DIR}}\）</h2>
    <span class="hint" id="acctCount"></span>
    <div class="tools">
      <button class="mini-btn" id="credBtn" style="display:none" onclick="loadCredits(true)">&#8635; 刷新积分</button>
      <button class="mini-btn" id="ckBtn" style="display:none" onclick="doCheckinAll()">&#10003; 一键签到</button>
      <button class="mini-btn" id="rfBtn" onclick="doRefreshAll()">&#8635; 一键续期</button>
    </div>
  </div>

  <div class="add-card" id="secAdd">
    <div class="add-head" onclick="toggleAdd()">
      <span class="add-title">＋ 添加账号</span>
      <span class="hint" id="addState">{{ADD_HINT}}</span>
    </div>
    <div class="add-body" id="addBody" style="display:none;">
      <label class="add-label">{{FILE_LABEL}}</label>
      <div class="file-row">
        <label class="file-btn" for="addFile">&#128194; 选择文件</label>
        <input type="file" id="addFile" class="file-inp" accept="{{ACCEPT}}">
        <span class="file-name" id="addFileName">未选择文件</span>
      </div>
      <label class="add-label">或直接粘贴 .info / storage.json 的完整内容</label>
      <textarea id="addContent" class="txt" rows="3" placeholder='{"account":{...},"auth":{...}}'></textarea>
      <label class="add-label">账号昵称 / 标识（自动从文件读取，可修改）</label>
      <input type="text" id="addName" class="inp" placeholder="例如：myaccount" autocomplete="off">
      <div class="add-actions">
        <button class="btn" id="addBtn" onclick="doAddFromFile()">保存账号</button>
        <button class="btn ghost" onclick="toggleAdd(false)">取消</button>
      </div>
    </div>
  </div>

  <div class="list" id="acctList"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div class="modal" id="confirmModal" style="display:none;">
  <div class="modal-box">
    <div class="modal-title">确认删除</div>
    <div class="modal-body">确定要从 {{AUTH_DIR}}\ 删除账号 <b id="delName"></b> 吗？此操作不可撤销。</div>
    <div class="add-actions">
      <button class="btn" onclick="doDelete()">确认删除</button>
      <button class="btn ghost" onclick="closeConfirm()">取消</button>
    </div>
  </div>
</div>

<div class="modal" id="migModal" style="display:none;">
  <div class="modal-box wide">
    <div class="modal-title">切换到 <span id="migNick"></span></div>
    <div class="modal-body">
      <div class="mig-sub" id="migSub"></div>
      <ul class="mig-list" id="migList"></ul>
      <div class="mig-note" id="migNote"></div>
      <div class="mig-note mig-info" id="migClientNote" style="display:none;"></div>
      <div class="mig-warn" id="migWarn" style="display:none;"></div>
      <div class="mig-conflict" id="migConflict" style="display:none;"></div>
      <div class="mig-opts">
        <label class="mig-chk"><input type="checkbox" id="migSessions" checked> 会话与任务</label>
        <label class="mig-chk"><input type="checkbox" id="migMemory" checked> 账号记忆</label>
        <label class="mig-chk"><input type="checkbox" id="migStorage" checked> 账号级设置</label>
        <label class="mig-chk"><input type="checkbox" id="migConnectors" checked> 连接器状态</label>
        <div class="mig-mode">
          <div>迁移方式</div>
          <label><input type="radio" name="migMode" value="move" checked> 移动 —— 改归属到新账号，旧账号不再看到</label>
          <label><input type="radio" name="migMode" value="share"> 共享 —— 置空归属，两个账号都能看到并继续</label>
        </div>
      </div>
    </div>
    <div class="add-actions">
      <button class="btn ghost" onclick="closeMig()">取消</button>
      <button class="btn ghost" onclick="migConfirm(false)">仅切换</button>
      <button class="btn" id="migGo" onclick="migConfirm(true)">切换并迁移</button>
    </div>
  </div>
</div>

<script>
const UI = { authDir: "{{AUTH_DIR}}", cmd: "{{CMD}}", credits: "{{CREDITS}}", checkin: "{{CHECKIN}}", migrate: "{{MIGRATE}}" };
const API = { accounts:'/api/accounts', current:'/api/current', switch:'/api/switch', add:'/api/add',
              remove:'/api/remove', refresh:'/api/refresh', credits:'/api/credits',
              checkinStatus:'/api/checkin-status', checkin:'/api/checkin', refreshAll:'/api/refresh-all',
              migratePreview:'/api/migrate-preview', pageAlive:'/api/page-alive',
              openClient:'/api/open-client' };

// ---- 页面心跳 + 重复页面识别 ---------------------------------------------
// 心跳让服务端知道"还有页面开着"，这样重复运行启动脚本时不会再开一个标签页。
// BroadcastChannel 负责认出"同一地址被开了第二个"（例如用户手动又开了一个），
// 让后来者自己提示并给出关闭入口 —— 浏览器不允许脚本关掉非脚本打开的标签页，
// 所以这里只能做到"可辨识 + 一键尝试关闭 + 失败给退路"。
(function(){
  function beat(){
    try{ fetch(API.pageAlive,{cache:'no-store'}).catch(function(){}); }catch(e){}
  }
  beat();
  setInterval(beat, 5000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) beat(); });

  if(typeof BroadcastChannel === 'undefined') return;
  var mine=Math.random().toString(36).slice(2), ch;
  try{ ch=new BroadcastChannel('wb_switcher_page'); }catch(e){ return; }
  ch.onmessage=function(e){
    var d=e.data||{};
    if(d.t==='hello' && d.id!==mine){ ch.postMessage({t:'taken', to:d.id, by:mine}); }
    else if(d.t==='taken' && d.to===mine){ showDupBar(); }
  };
  ch.postMessage({t:'hello', id:mine});
})();

function showDupBar(){
  var el=document.getElementById('dupBar');
  if(el) el.style.display='flex';
}

function closeThisTab(){
  window.close();
  setTimeout(function(){
    var el=document.getElementById('dupBar');
    if(el && el.style.display!=='none'){
      var s=el.querySelector('.dup-txt span');
      if(s) s.textContent='浏览器不允许脚本关闭这个标签页，请手动关闭（Ctrl+W）。';
    }
  }, 400);
}

// ---- 导航栏：锚点跳转 + 滚动高亮 -----------------------------------------
// 三个入口对应页面里的三个区块；sticky 常驻，滚动时高亮当前区块。
(function(){
  var links=[].slice.call(document.querySelectorAll('.nav-link'));
  if(!links.length) return;
  function activate(id){
    links.forEach(function(a){ a.classList.toggle('on', a.dataset.target===id); });
  }
  links.forEach(function(a){
    a.addEventListener('click', function(){
      var el=document.getElementById(a.dataset.target);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
      activate(a.dataset.target);
    });
  });
  var secs=links.map(function(a){ return document.getElementById(a.dataset.target); }).filter(Boolean);
  if(!secs.length) return;
  if('IntersectionObserver' in window){
    // rootMargin 上方留出 sticky 导航栏的高度，否则区块标题会被压在栏下面
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting) activate(e.target.id); });
    }, {rootMargin:'-64px 0px -55% 0px', threshold:0});
    secs.forEach(function(s){ io.observe(s); });
  }
  activate(secs[0].id);
})();

// ---- 打开 WorkBuddy 客户端 ------------------------------------------------
async function doOpenClient(){
  var btns=[document.getElementById('openClientBtn')].concat(
    [].slice.call(document.querySelectorAll('.acts .btn[onclick*="doOpenClient"]')));
  btns.forEach(function(b){ if(b){ b.disabled=true; } });
  var old=btns[0]?btns[0].textContent:null;
  if(btns[0]) btns[0].textContent='打开中…';
  try{
    var d=await post(API.openClient,{});
    toast(d.message, d.ok?'ok':'err');
  }catch(e){
    toast('打开客户端失败：'+e.message,'err');
  }finally{
    btns.forEach(function(b){ if(b){ b.disabled=false; } });
    if(btns[0] && old!==null) btns[0].textContent=old;
  }
}

async function req(path){
  const r = await fetch(path);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function post(path, data){
  const r = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Switcher-Token':(window.SWITCHER_TOKEN||'')},body:JSON.stringify(data||{})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function toast(msg,type='ok'){
  const el=document.createElement('div');
  el.className='toast '+(type==='ok'?'ok':'err');
  el.textContent=msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),320); }, 5000);
}
function setSrv(on){
  const dot=document.getElementById('srvDot');
  dot.className='status-dot '+(on?'on':'off');
  document.getElementById('srvText').textContent=on?'本地服务已连接':'本地服务未连接';
}
function fmtDate(s){
  if(!s) return '未知';
  const d=new Date(s);
  return d.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function remainDays(s){
  if(!s) return null;
  return (new Date(s)-Date.now())/86400000;
}
function initials(name){
  if(!name) return '?';
  const c=name.trim();
  return c.length>=2 ? c.slice(-2) : c;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtNum(v){
  const n=Number(v);
  if(!isFinite(n)) return '0';
  return n.toLocaleString('zh-CN',{maximumFractionDigits:2});
}

// 通道标签：oneid_login 才是长期；enterprise_switch 是短期（续期也不会变长）
function ttlTag(src, expiresAt){
  src = src||'';
  if(!src) return '';
  const short = src!=='oneid_login';
  const rd=remainDays(expiresAt);
  const days=(rd!=null&&rd>=0)?Math.round(rd):0;
  const text = short ? '短期 '+(days?days+'天':'通道') : '长期 '+(days?days+'天':'55天');
  return `<span class="tag-ttl${short?' short':''}" title="签发通道 token_source=${esc(src)}">${esc(text)}</span>`;
}

// 积分 / 签到数据都是按「账号文件名」索引的；当前账号要先按 uid 反查它在账号库里的文件
let creditsMap={}, creditsTs='', checkinMap={}, checkinTs='';
function fileForUid(uid){
  if(!uid) return '';
  const hit=(lastList||[]).find(a=>a.uid && a.uid===uid);
  return hit ? hit.file : '';
}
function creditsOf(file){ return (UI.credits==='1' && file) ? creditsMap[file] : null; }
function checkinOf(file){ return (UI.checkin==='1' && file) ? checkinMap[file] : null; }

function creditsBlock(file){
  if(UI.credits!=='1') return '';
  if(!file) return '<div class="credits"><div class="credits-msg">该账号不在账号库中，无积分数据</div></div>';
  const c=creditsMap[file];
  if(!c) return '<div class="credits"><div class="credits-pending">积分读取中…</div></div>';
  if(!c.ok){
    return '<div class="credits"><div class="credits-title">积分明细</div>'
      +'<div class="credits-msg err">'+esc(c.reason||'积分查询失败')+'</div></div>';
  }
  // 「总剩余积分」与「积分明细」并到一行 —— 省一行，列表更矮
  let h='<div class="credits"><div class="credits-total">总剩余积分 <b>'
    +fmtNum(c.total_remain)+'</b><span class="credits-title">积分明细</span></div>';
  const items=c.items||[];
  if(!items.length){
    return h+'<div class="credits-msg">暂无可用积分包</div></div>';
  }
  items.forEach(function(it){
    const pct=Math.max(0,Math.min(100,Number(it.used_percent)||0));
    // 档位名 / 时间 / 已使用量全部压到**同一行**：原来档位名单独占一行，
    // 两档就多出两行高度（实测行高被积分块主导，而不是左侧身份列）。
    // 三块都 nowrap，极窄时整块换行也不会出现"半边折行"的基线错位。
    // 第一排：档位名 + 时间；第二排：进度条 + 已使用量。
    // 数字紧挨进度条，读者能直接把条长和百分比对上；两排总宽相同、左右对齐。
    h+='<div class="ci">'
      +'<div class="ci-info">'
      +'<span class="ci-name">'+esc(it.label)+'</span>'
      +'<span class="ci-when">'+esc(it.time_label)+' '+esc(it.time||'-')+'</span></div>'
      +'<div class="ci-line">'
      +'<div class="ci-bar"><i style="width:'+pct+'%"></i></div>'
      +'<span class="ci-used">已使用 '+fmtNum(it.used)+'/'+fmtNum(it.total)
      +' 剩余'+esc(it.remain_percent)+'%</span></div>'
      +'</div>';
  });
  return h+'</div>';
}

function checkinBlock(file){
  if(UI.checkin!=='1') return '';
  if(!file) return '<div class="ck"><span class="dot"></span>该账号不在账号库中，无签到数据</div>';
  const c=checkinMap[file];
  if(!c) return '<div class="ck"><span class="dot"></span>签到状态读取中…</div>';
  if(!c.ok) return '<div class="ck err"><span class="dot"></span>'+esc(c.reason||'签到状态查询失败')+'</div>';
  if(c.active===false) return '<div class="ck"><span class="dot"></span>'+esc(c.msg||'签到活动未开启')+'</div>';
  const cls=c.checked_in?'ok':'todo';
  return '<div class="ck '+cls+'"><span class="dot"></span>'+esc(c.msg||(c.checked_in?'今日已签到':'今日未签到'))+'</div>';
}

async function loadCredits(force){
  if(UI.credits!=='1') return;
  const btn=document.getElementById('credBtn');
  if(btn){ btn.style.display='inline-flex'; btn.disabled=true; btn.textContent='查询中…'; }
  try{
    const d=await req(API.credits+(force?'?force=1':''));
    const map={};
    (d.accounts||[]).forEach(function(a){ map[a.file]=a; });
    creditsMap=map;
    creditsTs=d.ts||'';
    if(btn) btn.textContent='↻ 刷新积分';
  }catch(err){
    if(btn) btn.textContent='积分查询失败，点击重试';
  }finally{
    if(btn) btn.disabled=false;
    renderAll();
  }
}

async function loadCheckin(force){
  if(UI.checkin!=='1') return;
  const btn=document.getElementById('ckBtn');
  if(btn) btn.style.display='inline-flex';
  try{
    const d=await req(API.checkinStatus+(force?'?force=1':''));
    const map={};
    (d.accounts||[]).forEach(function(a){ map[a.file]=a; });
    checkinMap=map;
    checkinTs=d.ts||'';
  }catch(err){ /* 签到状态查不到不影响主体功能 */ }
  finally{ renderAll(); }
}

async function doCheckinAll(){
  const btn=document.getElementById('ckBtn');
  btn.disabled=true; btn.textContent='签到中…';
  try{
    const d=await post(API.checkin,{});
    toast(d.message, d.ok?'ok':'err');
    // 签到会加积分，两边都强制回源
    await Promise.all([loadCheckin(true), loadCredits(true)]);
  }catch(err){ toast('一键签到失败：'+err.message,'err'); }
  btn.disabled=false; btn.textContent='✓ 一键签到';
}

async function doRefreshAll(){
  const btn=document.getElementById('rfBtn');
  btn.disabled=true; btn.textContent='续期中…';
  try{
    const d=await post(API.refreshAll,{});
    toast(d.message, d.ok?'ok':'err');
    (d.results||[]).filter(r=>!r.ok).forEach(r=>toast(r.file+'：'+r.message,'err'));
    await load();
    await loadCheckin(true);
  }catch(err){ toast('一键续期失败：'+err.message,'err'); }
  btn.disabled=false; btn.textContent='↻ 一键续期';
}

let lastCurrent=null, lastList=[];
function currentFile(){
  const c=lastCurrent && lastCurrent[0];
  if(!c || c.ok===false || !c.uid) return '';
  return fileForUid(c.uid);
}
async function load(){
  try{
    setSrv(true);
    const [a,c] = await Promise.all([req(API.accounts), req(API.current)]);
    lastCurrent = c.current || null;
    lastList = a.accounts || [];
    renderAll();
  }catch(e){
    setSrv(false);
    document.getElementById('acctList').innerHTML =
      '<div class="empty">无法连接本地服务。请先双击 <code>'+esc(UI.cmd)+'</code>，或运行其对应的 --serve 命令。</div>';
    document.getElementById('curList').innerHTML='';
    document.getElementById('curHint').textContent='未连接';
  }
}

// 当前账号与列表行共用同一套结构，保证头像、通道标签、积分与签到的观感一致
function rowHtml(o){
  const tags=[];
  if(o.isCurrent) tags.push('<span class="tag-active">当前</span>');
  else if(!o.ok) tags.push('<span class="tag-unsafe">不可用</span>');
  const ttl = o.ok ? ttlTag(o.token_source, o.expires_at) : '';
  if(ttl) tags.push(ttl);

  let exp;
  if(o.ok){
    const rd=remainDays(o.expires_at);
    const cls = rd!=null && rd<3 ? ' warn':'';
    // 拆成两个 nowrap 片段：列窄时在"天"与日期之间整体换行，
    // 不会把"·"孤零零留在行尾（那样看起来就像和下一行串在一起）
    exp = '<div class="exp'+cls+'">'
        + '<span class="exp-ttl">登录态 '
        + (rd!=null ? (rd>=0 ? '剩余 <b>'+rd.toFixed(1)+'</b> 天' : '<b>已过期</b>') : '有效期未知')
        + '</span><span class="exp-when">· '+fmtDate(o.expires_at)+'</span></div>';
  } else {
    exp = '<div class="reason">'+esc(o.reason||'不可用')+'</div>';
  }

  // 当前账号行也带一个「打开客户端」：切完号正是需要它重新读取登录态的时候，
  // 放在这里比让用户回到顶部导航更顺手。列表行则只有切换/删除。
  const acts = o.isCurrent
    ? '<div class="acts">'
      + '<button class="btn ghost" onclick="doOpenClient()" '
      + 'title="启动 WorkBuddy 客户端（切号后需要它重新读取登录态）">&#9654; 打开客户端</button>'
      + '</div>'
    : '<div class="acts">'
      + '<button class="btn" data-file="'+esc(o.file)+'" data-nick="'+esc(o.nickname)+'" '
      + (o.ok?'':'disabled')+'>切换到该账号</button>'
      + '<button class="btn ghost danger" data-file="'+esc(o.file)+'" data-nick="'+esc(o.nickname)
      + '" title="从 '+esc(UI.authDir)+' 删除">删除</button>'
      + '</div>';

  return '<div class="row'+(o.isCurrent?' cur':'')+'">'
    + '<div class="who"><div class="avatar">'+esc(initials(o.nickname))+'</div>'
    + '<div class="who-body">'
    + '<div class="name">'+esc(o.nickname)+' '+tags.join(' ')+'</div>'
    + '<div class="meta">'+esc(o.file||'（不在账号库中）')+'</div>'  // 不再追加「· 桌面端正在使用」—— 行首的 [当前] 标签已经说明同一件事，
    // 重复会把这一行挤到折行，和下面的「登录态剩余」贴在一起（用户反馈的串行问题）
    + exp + checkinBlock(o.file)
    + '</div></div>'
    + '<div class="body">'+creditsBlock(o.file)+'</div>'
    + acts
    + '</div>';
}

function renderAll(){ renderCurrent(); renderAccounts(); }

function renderCurrent(){
  const box=document.getElementById('curList');
  const c=lastCurrent && lastCurrent[0];
  if(!c){
    document.getElementById('curHint').textContent='';
    box.innerHTML='<div class="empty">无法获取桌面端当前账号。</div>';
    return;
  }
  const file=currentFile();
  if(c.ok===false){
    document.getElementById('curHint').textContent='';
    box.innerHTML='<div class="empty">'+esc(c.reason||'桌面端当前未登录')+'</div>';
    return;
  }
  document.getElementById('curHint').textContent = file
    ? '（账号库中：'+file+'）'
    : '（不在账号库中，无法显示积分与签到）';
  box.innerHTML = rowHtml({
    isCurrent:true, ok:true, file:file,
    nickname:c.nickname||c.file||'未知',
    token_source:c.token_source||'', expires_at:c.expires_at,
  });
}

function renderAccounts(){
  const box=document.getElementById('acctList');
  const curFile=currentFile();
  const list=(lastList||[]).filter(a=>a.file!==curFile);   // 当前账号只在上方展示，列表里不重复
  document.getElementById('acctCount').textContent=
    list.length+' 个'+(creditsTs?(' · 积分更新于 '+creditsTs):'')+(checkinTs?(' · 签到更新于 '+checkinTs):'');
  if(!list.length){
    // 注意括号：字符串拼接的优先级高于三元，不括起来会恒真
    const onlyCurrent = (lastList||[]).length > 0;
    box.innerHTML='<div class="empty">' + (onlyCurrent
      ? '账号库里只有当前正在使用的这个账号。'
      : UI.authDir+'\\ 目录下没有账号文件。{{EMPTY_HINT}}') + '</div>';
    return;
  }
  box.innerHTML = list.map(a=>rowHtml({
    isCurrent:false, ok:!!a.ok, file:a.file, nickname:a.nickname,
    token_source:a.token_source||'', expires_at:a.expires_at, reason:a.reason,
  })).join('');
}

let pendingDeleteFile=null, pendingDeleteNick='';
function toggleAdd(force){
  const body=document.getElementById('addBody');
  const show = force===undefined ? (body.style.display==='none') : force;
  body.style.display = show?'flex':'none';
  document.getElementById('addState').textContent = show ? '导入后点击保存，内容会写入 '+UI.authDir+'\\' : "{{ADD_HINT}}";
}
function confirmDelete(file, nick){
  pendingDeleteFile=file; pendingDeleteNick=nick;
  document.getElementById('delName').textContent=nick+'（'+file+'）';
  document.getElementById('confirmModal').style.display='flex';
}
function closeConfirm(){
  document.getElementById('confirmModal').style.display='none';
  pendingDeleteFile=null; pendingDeleteNick='';
}
async function doDelete(){
  const file=pendingDeleteFile;
  closeConfirm();
  if(!file) return;
  try{
    const data=await post(API.remove,{file:file});
    toast(data.message, data.ok?'ok':'err');
    if(data.ok) load();
  }catch(err){ toast('请求失败：'+err.message,'err'); }
}
let selectedContent=null;
function refreshAddState(){
  const has=!!selectedContent && !!document.getElementById('addName').value;
  document.getElementById('addBtn').disabled=has?false:true;
}
document.getElementById('addFile').addEventListener('change', (e)=>{
  const f=e.target.files[0];
  if(!f) return;
  document.getElementById('addFileName').textContent=f.name;
  const rd=new FileReader();
  rd.onload=()=>{
    selectedContent=rd.result;
    let nick='';
    try{
      const data=JSON.parse(rd.result);
      nick=(data.account && data.account.nickname) || '';
    }catch(e){}
    document.getElementById('addName').value=nick||'';
    refreshAddState();
  };
  rd.readAsText(f);
});
document.getElementById('addName').addEventListener('input', refreshAddState);

async function doAddFromFile(){
  const name=document.getElementById('addName').value.trim();
  const pasted=(document.getElementById('addContent').value||'').trim();
  const content=selectedContent||pasted;
  const btn=document.getElementById('addBtn');
  if(!name){ toast('请填写账号昵称/标识','err'); return; }
  if(!content){ toast('请先选择账号文件，或粘贴其内容','err'); return; }
  btn.disabled=true; btn.textContent='保存中…';
  try{
    const data=await post(API.add,{name:name,content:content});
    toast(data.message, data.ok?'ok':'err');
    if(data.ok){
      document.getElementById('addFile').value='';
      document.getElementById('addFileName').textContent='未选择文件';
      document.getElementById('addName').value='';
      document.getElementById('addContent').value='';
      selectedContent=null;
      refreshAddState();
      toggleAdd(false);
      load();
    }
  }catch(err){ toast('请求失败：'+err.message,'err'); }
  btn.disabled=false; btn.textContent='保存账号';
}

document.getElementById('acctList').addEventListener('click', async (e)=>{
  const btn=e.target.closest('.btn');
  if(!btn || btn.disabled) return;
  if(btn.classList.contains('danger')){
    confirmDelete(btn.dataset.file, btn.dataset.nick||btn.dataset.file);
    return;
  }
  await startSwitch(btn.dataset.file, btn.dataset.nick||'', btn);
});

// ---- 切号（含可选的本地数据迁移）-----------------------------------------
// 迁移只改「归属键」，对话正文按项目目录存放、与账号无关，不搬（见 DESIGN_account_migration.md）。
let migCtx = null;

async function startSwitch(file, nick, btn){
  // 后端不支持迁移（Trae 侧）时，直接走原来的纯切换
  if(UI.migrate!=='1'){ return doSwitch(file, nick, btn, null); }
  if(btn){ btn.disabled=true; btn.textContent='检查中…'; }
  let pv=null;
  try{ pv=await req(API.migratePreview+'?name='+encodeURIComponent(file)); }
  catch(e){ /* 预览失败不该阻断切换 */ }
  if(btn){ btn.disabled=false; btn.textContent='切换到该账号'; }
  if(!pv || pv.ok===false || !pv.needed){
    if(pv && pv.ok===false) toast('迁移预览不可用，将只切换账号：'+esc(pv.message||''),'err');
    return doSwitch(file, nick, btn, null);
  }
  migCtx={file:file, nick:nick, preview:pv};
  renderMigModal(pv, nick);
}

function renderMigModal(pv, nick){
  document.getElementById('migNick').textContent = nick;
  const cur = (lastCurrent && lastCurrent[0]) ? (lastCurrent[0].nickname||'当前账号') : '当前账号';
  document.getElementById('migSub').textContent =
    '当前账号 ' + cur + ' 名下的本地数据：';
  const ul=document.getElementById('migList');
  ul.innerHTML=(pv.items||[]).map(function(it){
    return '<li><span class="k">'+esc(it.label)+'</span><span>'+esc(it.value)+'</span>'
         + (it.note?('<span class="n">'+esc(it.note)+'</span>'):'') + '</li>';
  }).join('') || '<li><span class="k">无可迁移数据</span></li>';
  document.getElementById('migNote').textContent = pv.projects_note || '';
  const w=document.getElementById('migWarn');
  const ws=(pv.warnings||[]);
  w.style.display = ws.length?'block':'none';
  w.innerHTML = ws.map(esc).join('<br>');
  const cf=document.getElementById('migConflict');
  const cs=(pv.conflicts||[]);
  cf.style.display = cs.length?'block':'none';
  cf.innerHTML = cs.length ? ('<b>冲突提示</b><br>'+cs.map(esc).join('<br>')) : '';
  // 客户端在跑**不再**禁用按钮：后端会在迁移前自动关掉它、完成后重新打开。
  // 这里只把这件事说清楚，让用户知道他的客户端会被关一下。
  const note = document.getElementById('migClientNote');
  if(note){
    note.textContent = pv.client_note || '';
    note.style.display = pv.client_note ? 'block' : 'none';
  }
  const go = document.getElementById('migGo');
  go.disabled = false;
  go.title = '';
  document.getElementById('migModal').style.display='flex';
}

function closeMig(){
  document.getElementById('migModal').style.display='none';
  migCtx=null;
}

async function migConfirm(withMigrate){
  const ctx=migCtx;
  if(!ctx) return;
  let mig=null;
  if(withMigrate){
    mig={
      enabled:true,
      sessions: document.getElementById('migSessions').checked,
      memory:   document.getElementById('migMemory').checked,
      storage:  document.getElementById('migStorage').checked,
      connectors: document.getElementById('migConnectors').checked,
      settings: true, snapshot: true,
      mode: (document.querySelector('input[name="migMode"]:checked')||{}).value || 'move'
    };
  }
  closeMig();
  await doSwitch(ctx.file, ctx.nick, null, mig);
}

async function doSwitch(file, nick, btn, mig){
  if(btn){ btn.disabled=true; btn.textContent='切换中…'; }
  try{
    const body = mig ? {name:file, migrate:mig} : {name:file};
    const data=await post(API.switch, body);
    toast(data.message, data.ok?'ok':'err');
    // 迁移的逐项结果与警告单独提示，别混在主消息里被忽略
    const m=data.migration;
    if(m){
      (m.steps||[]).filter(function(s){return !s.ok;}).forEach(function(s){
        toast('迁移·'+s.name+' 失败：'+s.detail,'err'); });
      (m.warnings||[]).forEach(function(x){ toast(x,'err'); });
    }
    if(data.ok){
      if(btn){ btn.disabled=false; btn.textContent='当前账号'; }
      // 续期只动本地账号库文件，不必等客户端采纳，切完立即发
      try{
        const sd=await post(API.refresh,{file:file});
        toast(sd.message, sd.ok?'ok':'err');
      }catch(e){}
      await settleAfterSwitch(nick);
    } else if(btn){ btn.disabled=false; btn.textContent='切换到该账号'; }
  }catch(err){
    toast('请求失败：'+err.message,'err');
    if(btn){ btn.disabled=false; btn.textContent='切换到该账号'; }
  }
}

function currentMatches(nick){
  const c = lastCurrent && lastCurrent[0];
  if(!c) return false;
  return !!nick && c.ok!==false && c.nickname===nick;
}
async function settleAfterSwitch(nick, tries=6, gap=500){
  for(let i=0;i<tries;i++){
    await load();
    if(currentMatches(nick)) return true;
    await new Promise(r=>setTimeout(r,gap));
  }
  return false;
}

// 三件事互不依赖：一起发，谁先回来谁先渲染（renderAll 可重复调用）。
// 以前是 load().then(()=>Promise.all([...]))，积分/签到要等列表回来才开始，
// 白白多一个串行段；服务端现在还会在启动时预热这两个缓存，常见情况直接命中。
load();
loadCredits();
loadCheckin();
</script>
